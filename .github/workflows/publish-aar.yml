name: Build and Publish AAR

on:
  push:
    branches: [arloom-compat]
    tags: ['v*']
  # Builds and verifies the AAR for PRs into arloom-compat; the publish step below is skipped for them.
  pull_request:
    branches: [arloom-compat]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.1.0). Leave empty for default SNAPSHOT.'
        required: false
        type: string

env:
  PACKAGE_NAME: llama-android
  GROUP_ID: com.github.creatiwi-ai

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # v3 installs the "tools" package by default, which the SDK repository no longer has
        # (sdkmanager fails with "Failed to find package 'tools'"). v4.0.2+ fixes that.
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          sdkmanager --install "cmake;3.22.1"

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="1.4.3-SNAPSHOT"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build AAR
        working-directory: examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :lib:assembleRelease --no-daemon

      # 1.1.0 to 1.4.1 shipped an InferenceEngineImpl that could not generate a single token
      # (Kotlin 2.0.0 compiled the generation loop into a throw). Never publish such an AAR again.
      - name: Verify generation loop in AAR bytecode
        working-directory: examples/llama.android
        run: |
          chmod +x scripts/verify-aar-bytecode.sh
          ./scripts/verify-aar-bytecode.sh lib/build/outputs/aar/lib-release.aar

      # Up to 1.4.2 every .so had 4 KB LOAD alignment, so System.loadLibrary failed on 16 KB page
      # devices, and ai_chat.cpp logged every chat message (the user's private memories) to logcat.
      # Never publish either again: every .so needs p_align >= 0x4000 and a 16 KB aligned RELRO end,
      # and no .so, class or source log call may write message text. READELF pins the NDK installed
      # above, not whichever NDK the runner image ships.
      - name: Verify native libraries in AAR (16 KB pages, no message text in logs)
        working-directory: examples/llama.android
        run: |
          export READELF="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          chmod +x scripts/verify-aar-native.sh
          ./scripts/verify-aar-native.sh lib/build/outputs/aar/lib-release.aar lib/src/main

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: examples/llama.android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :lib:publishReleasePublicationToGitHubPackagesRepository --no-daemon \
            -Pversion=$VERSION \
            -PgithubUser=${{ github.actor }} \
            -PgithubToken=${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-${{ steps.version.outputs.version }}
          path: examples/llama.android/lib/build/outputs/aar/*.aar
          retention-days: 90
